[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teams-agent-backend"
version = "0.1.0"
description = "Microsoft Teams echo bot backend built with the Microsoft 365 Agents SDK."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "aiohttp>=3.11,<4",
    "microsoft-agents-activity>=1.2,<1.3",
    "microsoft-agents-authentication-msal>=1.2,<1.3",
    "microsoft-agents-hosting-aiohttp>=1.2,<1.3",
    "microsoft-agents-hosting-core>=1.2,<1.3",
    "pillow>=11.3,<13",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
teams-agent = "teams_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
