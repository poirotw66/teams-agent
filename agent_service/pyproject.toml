[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teams-agent-rag-service"
version = "0.1.0"
description = "LangGraph Agentic RAG service for the Teams AI Agent."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.140,<0.141",
    "langchain>=1.3,<1.4",
    "langchain-google-genai>=4.3,<4.4",
    "langchain-openai>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "python-dotenv>=1.1,<2",
    "uvicorn[standard]>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.16,<1",
]

[project.scripts]
rag-agent = "agent_service.main:main"
rag-index = "agent_service.indexer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

