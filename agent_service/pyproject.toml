[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teams-agent-rag-service"
version = "0.1.0"
description = "LangGraph Agentic RAG service for the Teams AI Agent."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.140,<0.141",
    "httpx>=0.28,<1",
    "langchain>=1.3,<1.4",
    "langchain-google-genai>=4.3,<4.4",
    "langchain-openai>=1.4,<1.5",
    "langgraph>=1.2,<1.3",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<0.1",
    "pyyaml>=6.0,<7",
    "uvicorn[standard]>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.16,<1",
]
portal = [
    "PyJWT>=2.10,<3",
    "cryptography>=44,<47",
]
# Spec §8.3: Gemini File Search is a spike-only candidate adapter, not part
# of the default install. `google-genai` also happens to be pulled in
# transitively by langchain-google-genai today, but it is declared here
# explicitly (not in [project.dependencies]) so the Knowledge Service
# abstraction does not silently gain a hard dependency on it.
spike = [
    "google-genai>=1.0",
]
# Spec §10.3: the persistent Conversation Repository backend. Only needed
# when CONVERSATION_REPOSITORY_MODE=FIRESTORE, so MEMORY/FILE deployments
# and the test suite (which drives a Fake client) install nothing extra.
firestore = [
    "google-cloud-firestore>=2.20,<3",
]
bigquery = [
    "google-cloud-bigquery>=3.25,<4",
]

[project.scripts]
rag-agent = "agent_service.main:main"
rag-index = "agent_service.indexer:main"
knowledge-portal = "knowledge_portal.main:main"
ai-ops-backoffice = "ai_ops_backoffice.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service", "src/knowledge_portal", "src/ai_ops_backoffice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/knowledge_portal/api.py" = ["B008"]
"src/ai_ops_backoffice/api.py" = ["B008"]

