<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>知識營運介面</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div id="demoBanner" class="demo-banner hidden" role="status"></div>
    <header class="app-header">
      <div class="brand">
        <p class="eyebrow">Teams IT 智能助手</p>
        <h1>知識營運介面</h1>
        <span id="profileBadge" class="profile-badge"></span>
      </div>
      <div id="identityChip" class="identity-chip-wrap"></div>
    </header>

    <details id="demoControls" class="demo-controls hidden">
      <summary>Demo 身分設定</summary>
      <div class="demo-controls-body"></div>
    </details>

    <nav class="app-nav" aria-label="主要導覽">
      <button type="button" data-nav="#/work">我的工作</button>
      <button type="button" data-nav="#/knowledge">知識庫</button>
      <button type="button" data-nav="#/reviews">待審核</button>
      <button type="button" data-nav="#/audit">稽核紀錄</button>
    </nav>

    <main id="app" class="app-main"></main>

    <div id="dialogRoot"></div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
