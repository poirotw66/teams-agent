<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>知識營運已移至 Console</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
      body {
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        margin: 2rem;
        color: #0f172a;
        background: #f8fafc;
      }
      a { color: #0f6cbd; font-weight: 600; }
    </style>
  </head>
  <body>
    <p>舊版 <code>/knowledge-ui</code> 寫入流程已停用。正在導向 console-v2…</p>
    <p>若未自動導向，請開啟 <a id="fallback" href="/console-v2/knowledge">/console-v2/knowledge</a>。</p>
    <script>
      (function () {
        var map = {
          knowledge: "/console-v2/knowledge",
          work: "/console-v2/knowledge",
          reviews: "/console-v2/knowledge/reviews",
          releases: "/console-v2/knowledge/releases",
          audit: "/console-v2/knowledge/audit",
          catalog: "/console-v2/knowledge/catalog",
          sync: "/console-v2/knowledge/sync"
        };
        var raw = (location.hash || "").replace(/^#\/?/, "");
        var key = (raw.split("/")[0] || "knowledge").toLowerCase();
        var target = map[key] || "/console-v2/knowledge";
        var link = document.getElementById("fallback");
        if (link) link.setAttribute("href", target);
        location.replace(target);
      })();
    </script>
  </body>
</html>
