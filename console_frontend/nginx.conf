# Static host for the React console-v2 SPA.
# Assets are served under /console-v2/ to match Vite base and Backoffice routes.
# This image does not serve /api; use a same-origin gateway or Backoffice for BFF calls.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 307 /console-v2/dashboard;
    }

    location = /console-v2 {
        return 301 /console-v2/;
    }

    location /console-v2/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /console-v2/ {
        try_files $uri $uri/ /console-v2/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
