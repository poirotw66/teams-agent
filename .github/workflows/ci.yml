name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  teams-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src tests
      - name: Pytest
        run: uv run pytest -q

  agent-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend navigation tests
        run: node --experimental-vm-modules --test tests/frontend/*.test.mjs
      - name: Ruff
        run: uv run ruff check src tests
      - name: Architecture ratchet
        run: uv run python ../scripts/check_architecture.py
      - name: OpenAPI snapshot
        # Inventory + canonical ai_ops_backoffice OpenAPI; fails on drift and
        # classifies BREAKING removals/type changes when the canonical doc drifts.
        run: PYTHONPATH=src uv run python ../scripts/snapshot_openapi.py --check
      - name: Generated OpenAPI TypeScript freshness
        # Ensures console_frontend/src/shared/api/generated matches the canonical
        # Backoffice OpenAPI schemas + client. Regenerate with
        # scripts/generate_openapi_ts.py --write.
        run: PYTHONPATH=src uv run python ../scripts/generate_openapi_ts.py --check
      - name: Wire-contract compatibility
        run: PYTHONPATH=../src:src uv run python ../scripts/check_wire_contracts.py
      - name: Golden evaluation tests
        run: uv run pytest -q tests/test_golden_baseline.py tests/test_golden_baseline_pipeline.py
      - name: Release failure matrix
        run: uv run pytest -q tests/test_release_coordinator_matrix.py
      - name: Pytest
        run: uv run pytest -q

  playground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground_service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  console-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console_frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Component smoke tests
        run: npm test
      - name: Sync helper unit tests
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Typecheck, build, and production bundle freshness
        # Rebuilds to a temp dir (tsc + vite) and requires SHA-256 parity with
        # the committed agent_service/.../static/console-v2 artifact. Must run
        # before any step that writes the canonical outDir.
        # Regenerate locally: python3 scripts/sync_console_v2.py --write
        working-directory: ${{ github.workspace }}
        run: python3 scripts/sync_console_v2.py --check
